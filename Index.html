  const aviso = $("#aviso");

function destaque(){
  const n=futuros()[0], el=$("#prox");
  if(!n||filtro==="feito"||$("#q").value){ el.innerHTML=""; return; }
  const p=parte(n.data), dia=`${DIAS_L[dsem(n.data)]}, ${String(p.d).padStart(2,"0")} de ${MES[p.m]}`;
  el.innerHTML=`<div class="hero" onclick="abrir('${n.id}')"><small>PRÓXIMO DISCURSO</small><div class="hd">${dia}</div>`+
   (n.sem?`<div class="ht">🚫 Sem discurso</div><div class="hs">${esc(n.motivo)}</div>`
    :`<div class="ht">${esc(n.tema)||"Tema a definir"}</div><div class="hs">🎤 ${esc(n.orador)||"Orador a definir"}${n.cong?" · "+esc(n.cong):""}</div>`)+`</div>`;
}
function render(){
  const todos=ordenados(), nf=todos.filter(feito).length;
  [["todos","Todos ("+todos.length+")"],["prox","Próximos ("+(todos.length-nf)+")"],["def","A definir ("+todos.filter(aDefinir).length+")"],["feito","Já feitos ("+nf+")"]].forEach(([k,t])=>{ const b=document.querySelector('#tabs [data-f="'+k+'"]'); if(b) b.textContent=t; });
  listas(); destaque();
  const q = norm($("#q").value);
  let l = ordenados().filter(d=>{
    if(filtro==="prox"&&feito(d)) return false;
    if(filtro==="feito"&&!feito(d)) return false;
    if(filtro==="def"&&!aDefinir(d)) return false;
    return !q || norm(d.tema+" "+d.orador+" "+(d.motivo||"")).includes(q);
  });
  if(filtro==="feito") l.reverse();
  let h="", mesAtual="";
  l.forEach(d=>{
    const p=parte(d.data), chave=MES[p.m]+" "+p.y;
    if(chave!==mesAtual){ h+=`<h2 class="mes">${chave}</h2>`; mesAtual=chave; }
    const f=feito(d);
    const dn=DIAS[dsem(d.data)];
    if(d.sem){
      h+=`<div class="card sem ${f?"feito":""}" onclick="abrir('${d.id}')"><div class="dt"><b>${String(p.d).padStart(2,"0")}</b><span>${dn} · ${MES[p.m].slice(0,3)}</span></div>
      <div class="info"><div class="sem-t">🚫 Sem discurso</div><div class="sub">${esc(d.motivo)||"Motivo não informado"}</div></div>
      <div class="chev">›</div></div>`;
      return;
    }
    h+=`<div class="card ${f?"feito":""}" onclick="abrir('${d.id}')"><div class="dt"><b>${String(p.d).padStart(2,"0")}</b><span>${dn} · ${MES[p.m].slice(0,3)}</span></div>
    <div class="info"><div class="tema">${esc(d.tema)||"<i style='color:#999'>Tema a definir</i>"}${f?'<span class="tag">✔ Já feito</span>':(!d.tema||!d.orador?'<span class="tag pend">A definir</span>':"")}${dsem(d.data)!==0?'<span class="tag pend">'+DIAS_L[dsem(d.data)]+'</span>':""}</div>
    <div class="sub">🎤 ${esc(d.orador)||"Orador a definir"}${d.cong?" · "+esc(d.cong):""}</div>
    ${d.cant?`<div class="sub">🎵 ${esc(d.cant)}</div>`:""}${d.alm?`<div class="sub">🍽️ Almoço: ${esc(d.alm)}</div>`:""}</div>
    ${contato(d)}<div class="chev">›</div></div>`;
  });
  $("#lista").innerHTML = h || '<div class="vazio">'+(filtro==="def"?"🎉 Tudo definido! Nenhum discurso com tema ou orador faltando.":"Nenhum discurso encontrado.")+'</div>';
}

function atualizaForm(){
  const sem=$("#f_sem").checked; $("#bx_sem").style.display=sem?"":"none"; $("#bx_dis").style.display=sem?"none":"";
  
}
function montaDatas(atual){
  const usadas=bloqueadas(editId);
  const dt=new Date(); dt.setHours(12); if(editId) dt.setDate(dt.getDate()-60);
  const lista=[];
  while(dt.getFullYear()<=2040){ const g=dt.getDay(), iso=isoDe(dt); if((g===0||g===6)&&!usadas.has(iso)) lista.push(iso); dt.setDate(dt.getDate()+1); }
  if(atual && !lista.includes(atual)){ lista.push(atual); lista.sort(); }
  $("#f_data").innerHTML=lista.map(iso=>{ const p=parte(iso);
    return `<option value="${iso}">${DIAS_L[dsem(iso)]}, ${String(p.d).padStart(2,"0")}/${String(p.m+1).padStart(2,"0")}/${p.y}</option>`; }).join("");
}
function abrir(id){
  editId=id; const d=id?dados[id]:{data:proxDomingoLivre(),tema:"",orador:"",cong:"",cant:"",alm:"",sem:false,motivo:""};
  $("#dt").textContent=id?"Editar":"Novo";
  montaDatas(d.data); $("#f_data").value=d.data;$("#f_tema").value=d.tema;$("#f_orador").value=d.orador;
  $("#f_cong").value=d.cong;$("#f_tel").value=d.tel||"";$("#f_cant").value=d.cant;$("#f_alm").value=d.alm;
  $("#f_sem").checked=!!d.sem;$("#f_motivo").value=d.motivo||"";
  atualizaForm(); $("#b_del").style.display=id?"":"none"; $("#dlg").showModal();
}
$("#f_orador").addEventListener("change",()=>{
  const nome=$("#f_orador").value.trim().toUpperCase();
  const ant=ordenados().reverse().find(d=>d.orador===nome&&(d.cong||d.tel));
  if(ant){ if(!$("#f_cong").value) $("#f_cong").value=ant.cong||""; if(!$("#f_tel").value) $("#f_tel").value=ant.tel||""; }
});
$("#f_sem").onchange=atualizaForm; $("#f_data").onchange=atualizaForm;
$("#novo").onclick=()=>abrir(null);
$("#b_can").onclick=()=>$("#dlg").close();
$("#b_sal").onclick=()=>{
  const data=$("#f_data").value; if(!data){alert("Escolha a data.");return;}
  const sem=$("#f_sem").checked;
  if(sem&&!$("#f_motivo").value.trim()){alert("Informe o motivo de não ter discurso.");return;}
  const U=x=>$(x).value.trim().toUpperCase();
  const obj={data,sem,motivo:sem?$("#f_motivo").value.trim():"",tema:sem?"":U("#f_tema"),orador:sem?"":U("#f_orador"),
    cong:sem?"":U("#f_cong"),tel:sem?"":$("#f_tel").value.trim(),cant:sem?"":U("#f_cant"),alm:U("#f_alm")};
  const id=editId|| (usaFB?ref.push().key:"n"+Date.now());
  gravar(id,obj); $("#dlg").close();
};
$("#b_del").onclick=()=>{ if(confirm("Excluir este discurso?")){remover(editId);$("#dlg").close();} };
$("#q").oninput=render;
$("#tabs").onclick=e=>{ if(!e.target.dataset.f)return; filtro=e.target.dataset.f;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===e.target)); render(); };

const futuros=()=>ordenados().filter(d=>!feito(d));
const rot=iso=>{const p=parte(iso);return `${DIAS_L[dsem(iso)]}, ${String(p.d).padStart(2,"0")}/${String(p.m+1).padStart(2,"0")}/${p.y}`;};
function contaImp(){
  const de=$("#i_de").value, ate=$("#i_ate").value;
  const n=futuros().filter(d=>d.data>=de&&d.data<=ate).length;
  $("#i_n").textContent=de>ate?"A data final precisa ser igual ou depois da inicial.":n+(n===1?" data no período":" datas no período");
  $("#i_ok").disabled=de>ate||!n;
}
$("#imp").onclick=()=>{
  const l=futuros();
  if(!l.length){alert("Não há discursos futuros para imprimir.");return;}
  const op=l.map(d=>`<option value="${d.data}">${rot(d.data)}</option>`).join("");
  $("#i_de").innerHTML=op; $("#i_ate").innerHTML=op; $("#i_ate").value=l[l.length-1].data;
  contaImp(); $("#dlgImp").showModal();
};
$("#i_de").onchange=contaImp; $("#i_ate").onchange=contaImp;
$("#i_can").onclick=()=>$("#dlgImp").close();
$("#i_ok").onclick=()=>{ const de=$("#i_de").value, ate=$("#i_ate").value; $("#dlgImp").close(); gerarPDF(de,ate); };
function gerarPDF(de,ate){
  const l=futuros().filter(d=>d.data>=de&&d.data<=ate);
  let h="", mesAtual="";
  l.forEach(d=>{
    const p=parte(d.data), chave=MES[p.m]+" de "+p.y;
    let mesHtml=""; if(chave!==mesAtual){mesHtml=`<div class="p-mes">${chave}</div>`;mesAtual=chave;}
    const dn=DIAS[dsem(d.data)];
    h+=`<tr><td>${mesHtml}<div class="p-it ${d.sem?"sem":""}"><div class="p-dt"><b>${String(p.d).padStart(2,"0")}</b><span>${MES[p.m].slice(0,3)} · ${dn}</span></div>
    <div class="p-tx">`+(d.sem
      ? `<div class="p-tm">Sem discurso público</div><div class="p-or">${esc(d.motivo)}</div>`
      : `<div class="p-tm">${esc(d.tema)||"Tema a definir"}</div><div class="p-or"><i>Orador:</i> ${esc(d.orador)||"A definir"}${d.cong?" · <i>Congregação:</i> "+esc(d.cong):""}</div>`)+(d.alm?`<div class="p-al"><i>Almoço:</i> ${esc(d.alm)}</div>`:"")+`</div></div></td></tr>`;
  });
  $("#print").innerHTML=`<table class="p-tb"><thead><tr><th><div class="p-top"><h1>ARRANJO DE ORADORES</h1><h2>Congregação Livramento</h2></div></th></tr></thead><tbody>${h}</tbody></table>`; window.print();
}
iniciar();
</script>
</body>
</html>
